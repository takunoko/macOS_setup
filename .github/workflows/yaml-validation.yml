name: YAML Validation

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml-validation.yml"
      - ".yamllint"
  push:
    branches:
      - main
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml-validation.yml"
      - ".yamllint"

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install ansible yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run Ansible syntax check
        run: ANSIBLE_LOCAL_TEMP=/tmp/ansible-local ansible-playbook --syntax-check setup.yml -i inventory

  propose-fix:
    if: >-
      needs.validate.result == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'ci/yaml-fix-pr-')
    needs: validate
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML formatter
        run: npm install --global prettier@3.6.2

      - name: Format YAML files
        run: prettier --bracket-spacing=false --write "**/*.{yml,yaml}"

      - name: Verify proposed changes
        run: |
          python -m pip install yamllint
          yamllint .

      - name: Create YAML fix pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.event.pull_request.head.ref }}
          branch: ci/yaml-fix-pr-${{ github.event.pull_request.number }}
          delete-branch: true
          title: "fix: YAML lint errors in #${{ github.event.pull_request.number }}"
          commit-message: "fix: format YAML files"
          body: |
            元PR #${{ github.event.pull_request.number }} のYAML lintエラーを自動修正するPRです。

            元PRのブランチをbaseにしています。先にこのPRをマージしてください。
