- block:
  - name: install mas cli
    homebrew:
      name: mas
      state: present

  - name: check App Store sign-in
    command: mas account
    register: mas_account
    check_mode: no
    changed_when: no
    failed_when: no

  - name: require App Store sign-in before installing mas apps
    fail:
      msg: App Storeにサインインした状態で `ansible-playbook setup.yml -i inventory --tags mas` を実行してください。
    when: mas_account.rc != 0

  - name: fetch list
    command: mas list
    register: installed_list
    check_mode: no
    changed_when: no

  - name: install App Store applications
    command: "mas install {{ item.id }}"
    when: "installed_list.stdout_lines | select('search', item.id) | list | length == 0"
    loop: "{{ apps }}"

  tags:
    - never
    - mas
